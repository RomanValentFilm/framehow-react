name = "framehow-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Vars (non-secret defaults). Override per-environment as needed.
[vars]
APP_NAME = "Framehow"
# WHERE THE APP LIVES (9 Oct). The reset link in a mail is built from this, and
# the app reads its token off its own address. The FIRST one is the live app and
# the fallback; the others are addresses the app may ask for (one server serves
# both the live app and dev). Nothing outside this list is ever put in a mail.
APP_URL = "https://framehow.com/app"
APP_URLS = "https://framehow.com/app, https://dev.framehow-react.pages.dev/app, http://127.0.0.1:5173/app"
# THE CEILING (12 Oct, Roman): the most the whole of Framehow may hold at
# Cloudflare, in GB. Cloudflare itself never stops — it bills — so this is the
# brake. Above the free 10 GB, 50 GB costs at most 60 cents a month. Change the
# number here and deploy the backend; nothing else needs touching.
GLOBAL_STORAGE_LIMIT_GB = "50"
# THE LIMIT PER ACCOUNT, in MB — all of a user's projects together (#533).
# 350 MB until 23 Oct; Roman, on a fitting whose first project was 150 MB at
# once: "let's do 500mb now per account". Change and deploy the backend.
STORAGE_LIMIT_MB = "500"
SESSION_TTL_DAYS = "30"
PASSWORD_RESET_TTL_HOURS = "1"
EMAIL_VERIFY_TTL_HOURS = "48"
# Admin email for storage alerts (admin-only feature, see spec).
ADMIN_EMAIL = "roman@valentfilm.com"

# MAIL (9 Oct) — Cloudflare Email Sending. No key and no secret: the binding
# belongs to the Worker. framehow.com is onboarded for sending; mail goes out
# from info@framehow.com.
[[send_email]]
name = "EMAIL"

# Secrets to set via `wrangler secret put`:
#   EMAIL_API_KEY      — provider key (Resend / MailChannels / etc.)
#   EMAIL_FROM         — verified sender address
#   ADMIN_API_TOKEN    — bearer token for /admin/* endpoints

# D1 — primary database
[[d1_databases]]
binding = "DB"
database_name = "framehow-db"
database_id = "9a805ca2-576c-4c8c-8af4-71016b8711b5"
migrations_dir = "migrations"

# R2 — project storage (frame images, drawings, etc.)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "framehow-storage"

# Cron trigger — daily cleanup of expired projects (deleted > 7 days ago)
[triggers]
crons = ["0 3 * * *"]
